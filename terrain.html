<!doctype html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<html lang="en-GB">
    <head>
        <title>terrain</title>
        <style>
            :root {
                font-family: system-ui;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            table {
                border-collapse: collapse;
                transform: rotate(-45deg) skew(15deg, 15deg);
                max-width: 80%;
                overflow: scroll;
            }

            td {
                height: 2rem;
                width: 2rem;
                font-size: 8px;
            }

            .grass {
                background-color: #ae4;
            }

            .grass:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #cf7;
            }

            .grass.selected {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                border: 0.1rem dashed #f00;
                background-color: #cf7;
                box-sizing: border-box;
            }

            .grass.unavailable {
                background-color: #8c2;
            }

            .grass.unavailable:hover {
                transform: translate3d(0rem, 0rem, 0rem);
            }

            .water {
                background-color: #aef;
            }

            .water:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #cff;
            }

            .water.selected {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                border: 0.1rem dashed #f00;
                background-color: #cff;
                box-sizing: border-box;
            }

            .water.unavailable {
                background-color: #8ce;
            }

            .water.unavailable:hover {
                transform: translate3d(0rem, 0rem, 0rem);
            }

            .forest {
                background-color: #291;
            }

            .forest:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #5b4;
            }

            .forest.unavailable {
                background-color: #161;
            }

            .forest.unavailable:hover {
                transform: translate3d(0rem, 0rem, 0rem);
            }

            .rocks {
                background-color: #ccc;
            }

            .rocks:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #ddd;
            }

            .something {
                height: 1rem;
                width: 1rem;
                font-size: 8px;
            }

            .good {
                background-color: #fafafa;
            }

            .evil {
                background-color: #fd9;
            }

            .selectedActions {
                display: none;
                flex-direction: row;
                justify-content: space-evenly;
                position: absolute;
                width: 80%;
                bottom: 0rem;
                height: 5rem;
                left: 0rem;
                background-color: #eee;
            }

            .selectedInfo {
                display: none;
                flex-direction: row;
                justify-content: space-evenly;
                position: absolute;
                width: 20%;
                bottom: 0rem;
                height: 8rem;
                right: 0rem;
                background-color: #eee;
            }
        </style>
    </head>
    <body>
        <table id="grid"></table>

        <div id="selectedActions" class="selectedActions">
            <button id="moveButton" onclick="showMovementRange()">move</button>
            <!--<button>attack</button>-->
        </div>
        <div class="selectedInfo" id="selectedInfo"></div>

        <script>
            const GRIDSIZE = 20;
            const STEPSIZE = 4;
            const grid = document.getElementById("grid");
            const terrains = ["grass", "grass", "grass", "grass", "forest", "forest", "water", "rocks"];
            const terrainMap = [];
            const allCells = [];
            const entityMap = {};
            const entityList = {};

            let selectedCell = "";

            function randomTerrain() {
                return terrains[Math.floor(Math.random() * terrains.length)];
            }

            function inBounds(x, y) {
                return x > -1 && x < GRIDSIZE && y > -1 && y < GRIDSIZE;
            }

            function selectCell(cell) {
                if (selectedCell == cell.id) {
                    selectedCell = "";
                    cell.classList.remove("selected");
                    allCells.forEach((x) => {
                        document.getElementById(x).classList.remove("unavailable");
                    });

                    resetGrid();
                } else {
                    if (selectedCell != "") {
                        document.getElementById(selectedCell).classList.remove("selected");
                    }

                    selectedCell = cell.id;
                    cell.classList.add("selected");
                }

                const selectedEntity = entityMap[cell.id];

                if (selectedEntity) {
                    document.getElementById("selectedInfo").style.display = "flex";
                    document.getElementById("selectedActions").style.display = "flex";
                    document.getElementById("selectedInfo").innerText = entityList[selectedEntity]?.name ?? "";
                } else {
                    document.getElementById("selectedInfo").style.display = "none";
                    document.getElementById("selectedActions").style.display = "none";
                }
            }

            function moveEntity(start, destination) {
                const child = document.getElementById(start).childNodes[0];

                document.getElementById(destination).appendChild(child);
                document.getElementById(start).childNodes = null;
                entityMap[destination] = entityMap[start];
                entityMap[start] = "";

                allCells.forEach((x) => {
                    document.getElementById(x).classList.remove("unavailable");
                });
            }

            function getDistance(p1, p2) {
                return Math.sqrt((p2[0] - p1[0]) ** 2 + (p2[1] - p1[1]) ** 2);
            }

            function getCircle(coordinate, radius) {
                const cy = coordinate[0];
                const cx = coordinate[1];
                const points = [];

                for (let y = cy - radius; y <= cy + radius; y++) {
                    for (let x = cx - radius; x <= cx + radius; x++) {
                        if (Math.round(getDistance(coordinate, [y, x])) <= radius) points.push([y, x]);
                    }
                }

                return points;
            }

            function showMovementRange() {
                if (entityMap[selectedCell]) {
                    allCells.forEach((x) => {
                        const cell = document.getElementById(x);

                        cell.classList.add("unavailable");
                        cell.onclick = function () {};
                    });

                    for (const coord of getCircle(selectedCell.split("|"), STEPSIZE)) {
                        if (inBounds(coord[0], coord[1])) {
                            const cellId = `${coord[0]}|${coord[1]}`;

                            if (!entityMap[cellId]) {
                                const cell = document.getElementById(cellId);
                                cell.classList.remove("unavailable");
                                cell.onclick = function () {
                                    moveTo(cell);
                                };
                            }
                            document.getElementById(selectedCell).classList.remove("unavailable");
                        }
                    }
                }

                document.getElementById("moveButton").onclick = function () {
                    resetGrid();
                };
            }

            function resetGrid() {
                allCells.forEach((x) => {
                    const cell = document.getElementById(x);

                    cell.classList.remove("unavailable");
                    cell.onclick = function () {
                        selectCell(cell);
                    };
                });

                document.getElementById("moveButton").onclick = function () {
                    showMovementRange();
                };
            }

            function moveTo(cell) {
                if (entityMap[selectedCell]) {
                    moveEntity(selectedCell, cell.id);
                    document.getElementById(selectedCell).classList.remove("selected");
                }

                selectedCell = cell.id;
                cell.classList.add("selected");
                resetGrid();
            }

            for (let row = 0; row < GRIDSIZE; row++) {
                const newRow = [];
                for (let column = 0; column < GRIDSIZE; column++) {
                    newRow.push("water");
                }
                terrainMap.push(newRow);
            }

            for (let island = 0; island < 5; island++) {
                const cx = Math.floor(Math.random() * GRIDSIZE);
                const cy = Math.floor(Math.random() * GRIDSIZE);

                const radius = 3 + Math.floor(Math.random() * 4);

                for (const coord of getCircle([cy, cx], radius)) {
                    if (inBounds(coord[0], coord[1])) terrainMap[coord[0]][coord[1]] = "grass";
                }
            }

            for (i in terrainMap) {
                const newRow = document.createElement("tr");

                for (j in terrainMap[i]) {
                    const cellId = `${i}|${j}`;
                    const newCell = document.createElement("td");

                    newCell.id = cellId;
                    allCells.push(cellId);

                    const t = terrainMap[i][j];

                    newCell.classList.add(terrainMap[i][j]);
                    newCell.onclick = function () {
                        selectCell(newCell);
                    };
                    newRow.appendChild(newCell);
                }

                grid.append(newRow);
            }

            for (i in terrainMap) {
                for (j in terrainMap[i]) {
                    if (terrainMap[i][j] == "grass") {
                        const chance = Math.random();

                        if (chance >= 0.98) {
                            for (const coord of getCircle([i, j], 2)) {
                                if (inBounds(coord[0], coord[1])) {
                                    document.getElementById(`${coord[0]}|${coord[1]}`).classList = "forest";
                                }
                            }
                        }
                    }
                }
            }

            function makeEntities(data) {
                data.forEach((x, i) => {
                    const [location, details] = x;
                    const id = i + 1;

                    const e = document.createElement("div");
                    e.classList.add("something", details.class);
                    e.innerText = id;
                    e.id = id;
                    e.title = details.name;

                    entityMap[location] = id;
                    entityList[id] = details;

                    document.getElementById(location).appendChild(e);
                });
            }

            makeEntities([
                [
                    "10|10",
                    {
                        name: "you",
                        hitPoints: 10,
                        movementRange: 4,
                        class: "good",
                    },
                ],
                [
                    "15|15",
                    {
                        name: "enemy",
                        hitPoints: 10,
                        movementRange: 4,
                        class: "evil",
                    },
                ],
            ]);
        </script>
    </body>
</html>
