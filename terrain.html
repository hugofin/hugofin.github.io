<!doctype html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<html lang="en-GB">
    <head>
        <title>terrain</title>
        <style>
            :root {
                font-family: system-ui;
                --text: light-dark(#000, #fcf4e3);
                background-color: #2d2821;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                /*background-color: var(--bg);*/
            }

            table {
                border-collapse: collapse;
                transform: rotate(-45deg) skew(15deg, 15deg);
                max-width: 80%;
                overflow: scroll;
            }

            td {
                height: 2rem;
                width: 2rem;
                font-size: 8px;
            }

            .grass {
                background-color: #ae4;
            }

            .grass:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #cf7;
            }

            .grass.selected {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                border: 0.1rem dashed #f00;
                background-color: #cf7;
                box-sizing: border-box;
            }

            .water {
                background-color: #aef;
            }

            .water:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #cff;
            }

            .water.selected {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                border: 0.1rem dashed #f00;
                background-color: #cff;
                box-sizing: border-box;
            }

            .forest {
                background-color: #8b1;
            }

            .forest:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #be4;
            }

            .rocks {
                background-color: #ccc;
            }

            .rocks:hover {
                transform: translate3d(0.25rem, -0.25rem, 0.25rem);
                background-color: #ddd;
            }

            .option {
                background-color: #fdd;
            }

            .something {
                height: 1rem;
                width: 1rem;
                font-size: 8px;
                background-color: #f00;
            }

            .actions {
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                position: absolute;
                width: 100%;
                bottom: 0rem;
            }
        </style>
    </head>
    <body>
        <table id="grid"></table>

        <div class="actions">
            <button>move</button>
            <button>attack</button>
        </div>

        <script>
            const GRIDSIZE = 20;
            const STEPSIZE = 4;
            const grid = document.getElementById("grid");
            const terrains = ["grass", "grass", "grass", "grass", "forest", "forest", "water", "rocks"];
            const terrainMap = [];
            const entities = {};

            let selectedCell = "";

            function randomTerrain() {
                return terrains[Math.floor(Math.random() * terrains.length)];
            }

            function inBounds(x, y) {
                return x > -1 && x < GRIDSIZE && y > -1 && y < GRIDSIZE;
            }

            function selectCell(cell) {
                if (selectedCell == cell.id) {
                    selectedCell = "";
                    cell.classList.remove("selected");
                } else {
                    if (entities[selectedCell]) {
                        moveEntity(selectedCell, cell.id);
                        document.getElementById(selectedCell).classList.remove("selected");
                        return;
                    }

                    if (selectedCell != "") {
                        document.getElementById(selectedCell).classList.remove("selected");
                    }

                    selectedCell = cell.id;
                    cell.classList.add("selected");

                    // if (entities[selectedCell]) {
                    //     for (const coord of getCircle(selectedCell.split("|"), STEPSIZE)) {
                    //         if (inBounds(coord[0], coord[1])) document.getElementById(`${coord[0]}|${coord[1]}`).classList.add("option");
                    //     }
                    //     return;
                    // }
                }
            }

            function moveEntity(start, destination) {
                const child = document.getElementById(start).childNodes[0];

                document.getElementById(destination).appendChild(child);
                document.getElementById(start).childNodes = null;
                entities[destination] = entities[start];
                entities[start] = "";

                // for (const coord of getCircle(start.split("|"), STEPSIZE)) {
                //     if (inBounds(coord[0], coord[1])) document.getElementById(`${coord[0]}|${coord[1]}`).classList.remove("option");
                // }
            }

            function getDistance(p1, p2) {
                return Math.sqrt((p2[0] - p1[0]) ** 2 + (p2[1] - p1[1]) ** 2);
            }

            function getCircle(coordinate, radius) {
                const cy = coordinate[0];
                const cx = coordinate[1];
                const points = [];

                for (let y = cy - radius; y <= cy + radius; y++) {
                    for (let x = cx - radius; x <= cx + radius; x++) {
                        if (Math.round(getDistance(coordinate, [y, x])) <= radius) points.push([y, x]);
                    }
                }

                return points;
            }

            for (let row = 0; row < GRIDSIZE; row++) {
                const newRow = [];
                for (let column = 0; column < GRIDSIZE; column++) {
                    newRow.push("water");
                }
                terrainMap.push(newRow);
            }

            for (let island = 0; island < 5; island++) {
                const cx = Math.floor(Math.random() * GRIDSIZE);
                const cy = Math.floor(Math.random() * GRIDSIZE);

                const radius = 3 + Math.floor(Math.random() * 4);

                for (const coord of getCircle([cy, cx], radius)) {
                    if (inBounds(coord[0], coord[1])) terrainMap[coord[0]][coord[1]] = "grass";
                }
            }

            for (i in terrainMap) {
                const new_row = document.createElement("tr");
                new_row.id = `r${i}`;

                for (j in terrainMap[i]) {
                    const new_cell = document.createElement("td");

                    new_cell.id = `${i}|${j}`;

                    const t = terrainMap[i][j];

                    if (t == "grass") {
                    }

                    new_cell.classList.add(terrainMap[i][j]);
                    new_cell.onclick = function () {
                        selectCell(new_cell);
                    };
                    new_row.appendChild(new_cell);

                    entities[`r${i}c${j}`] = "";
                }

                grid.append(new_row);
            }

            const one = document.getElementById("1|1");
            const something = document.createElement("div");
            something.classList.add("something");
            something.innerText = "A";
            something.id = "A";

            entities["1|1"] = "A";

            one.appendChild(something);
        </script>
    </body>
</html>
